<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Study Zone Quiz System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Register -->
  <div id="register-container" class="login-card">
    <h1 class="title">Register</h1>
    <input type="text" id="reg-username" placeholder="Enter name">
    <input type="password" id="reg-password" placeholder="Enter password">
    <button id="register-btn" class="btn">Register</button>
    <p>Already have an account? <span id="go-login" class="link">Login</span></p>
  </div>

  <!-- Login -->
  <div id="login-container" class="login-card" style="display:none;">
    <h1 class="title">Login</h1>
    <input type="text" id="username" placeholder="Enter name">
    <input type="password" id="password" placeholder="Enter password">
    <button id="login-btn" class="btn">Login</button>
    <p>New user? <span id="go-register" class="link">Register</span></p>
  </div>

  <!-- Quiz Selection -->
  <div id="quiz-selection" class="quiz-container" style="display:none;">
    <h1 class="title">Available Quizzes</h1>
    <div id="quiz-list"></div>
  </div>

  <!-- Quiz Page -->
  <div id="quiz-container" class="quiz-container" style="display:none;">
    <h1 class="title">Welcome, <span id="user-name"></span>!</h1>
    <div id="question-box" class="card"></div>
    <div id="options-box"></div>
    <div id="timer" class="timer"></div>
    <div id="score-board" class="score-board">Score: 0</div>
    <button id="next-btn" class="btn">Next</button>
  </div>

  <!-- Leaderboard -->
  <div id="leaderboard-container" class="login-card" style="display:none;">
    <h1 class="title">Leaderboard</h1>
    <ul id="leaderboard-list"></ul>
    <button id="back-to-login" class="btn">Back</button>
  </div>

  <!-- Admin Panel -->
  <div id="admin-container" class="login-card" style="display:none;">
    <h1 class="title">Admin Panel</h1>
    <h2>Add Quiz</h2>
    <input type="text" id="new-quiz-name" placeholder="Quiz Name">
    <input type="text" id="quiz-start" placeholder="Start (YYYY-MM-DDTHH:mm:ss)">
    <input type="text" id="quiz-end" placeholder="End (YYYY-MM-DDTHH:mm:ss)">
    <input type="number" id="quiz-duration" placeholder="Duration (minutes)">
    <button id="add-quiz-btn" class="btn">Add Quiz</button>

    <h2>Add Question</h2>
    <select id="quiz-select"></select>
    <input type="text" id="new-question" placeholder="Question">
    <input type="text" id="option1" placeholder="Option 1">
    <input type="text" id="option2" placeholder="Option 2">
    <input type="text" id="option3" placeholder="Option 3">
    <input type="text" id="option4" placeholder="Option 4">
    <input type="text" id="correct-answer" placeholder="Correct Answer">
    <button id="add-question-btn" class="btn">Add Question</button>

    <h2>Manage</h2>
    <button id="delete-quiz-btn" class="btn">Delete Quiz</button>
    <button id="view-answer-key" class="btn">Answer Key</button>
    <button id="view-results" class="btn">Results</button>
    <button id="enable-practice" class="btn">Toggle Practice Mode</button>
    <button id="logout-admin" class="btn">Logout</button>
    <div id="admin-output"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
